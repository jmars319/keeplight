[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # pin-utils is unmaintained, not vulnerable. It is reached only at compile
    # time, through Slint's spin_on (slint-build, slint-macros), and is not in
    # the shipped exe. Slint 1.18.1 is the newest release. Expires 2027-02-08;
    # recorded in agentic-instructions docs/security-advisory-decisions.md.
    { id = "RUSTSEC-2026-0441", reason = "compile-time only via Slint's spin_on; no upgrade; expires 2027-02-08" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# No HTTP or TLS crates. Keeplight's only connection is to OpenRGB on
# 127.0.0.1, over a plain TCP socket from the standard library.
# No async runtime either, except at one edge: the OpenRGB client, the window
# and the keeper are synchronous on purpose. tokio is allowed only through
# rmcp (with its tokio-stream and tokio-util) and keeplight-core's MCP server
# (`keeplight-cli mcp`), owner decision
# 2026-11-13 (docs/adr/0001-build-on-openrgb.md, docs/ai.md).
deny = [
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "ureq" },
    { crate = "curl" },
    { crate = "isahc" },
    { crate = "openssl" },
    { crate = "native-tls" },
    { crate = "rustls" },
    { crate = "tokio", wrappers = ["rmcp", "tokio-stream", "tokio-util", "keeplight-core"] },
    { crate = "axum" },
    # openrgb2 is GPL-2.0-only, which cannot be combined with this
    # GPL-3.0-only app, and openrgb is its unmaintained predecessor
    # (docs/adr/0001-build-on-openrgb.md).
    { crate = "openrgb2" },
    { crate = "openrgb" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
