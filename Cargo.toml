[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/jmars319/keeplight"
rust-version = "1.92"
publish = false

[workspace.dependencies]
keeplight-core = { path = "crates/core", version = "0.2.0" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
